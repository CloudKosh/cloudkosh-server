# docker-compose.yml
version: "3"
services:
  app:
    # restart: on-failure
    container_name: cloudkosh-server
    image: cloudkosh-test-server
    build:
      context: ../
      dockerfile: Dockerfile
    entrypoint: /sbin/tini
    command: -- npm run debug
    environment:
      - PORT=80
      - CASTING_SERVER_DEV_TEST_MODE=true
      # - CASTING_SERVER_DB_DATABASE=Casting800LiveTest
    ports:
      - 9991:80
      - 9229:9229
    networks:
      - ck_network
    dns:
      - 1.1.1.1
      - 8.8.8.8

networks:
  ck_network:
    driver: bridge
