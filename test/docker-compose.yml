# docker-compose.yml
version: "3"
services:
  app:
    # restart: on-failure
    container_name: casting-server-2025
    image: casting-server-2025
    build:
      context: ../
      dockerfile: Dockerfile
    entrypoint: /sbin/tini
    command: -- npm run debug
    environment:
      - PORT=80
      - CASTING_SERVER_DEV_TEST_MODE=true
      # - CASTING_SERVER_DB_DATABASE=Casting800LiveTest
    ports:
      - 9991:80
      - 9229:9229
    volumes:
      - fcs:/fcs
    networks:
      - app_network
    dns:
      - 1.1.1.1
      - 8.8.8.8
  puppeteer:
    image: ghcr.io/social-mail/puppeteer-server:latest
    container_name: casting-puppeteer-800
    restart: unless-stopped
    environment:
      - PORT=8123
      - HOST=0.0.0.0
      - LOCALHOST=v2025-800casting.com
    ports:
      - 8123:8123
    networks:
      - app_network  

  file-conversion-server:
    image: ghcr.io/social-mail/file-conversion-server:latest
    container_name: file-conversion-server
    restart: unless-stopped
    environment:
      - PORT=/fcs/sockets/fcs.sock
      - HOST=0.0.0.0
      - LOCALHOST=v2025-800casting.com
    volumes:
      - fcs:/fcs
    networks:
      - app_network

volumes:
  fcs:
    external: false

networks:
  app_network:
    driver: bridge
