# docker-compose.yml
version: "3"
services:

  cloudkosh-pg-db:
    image: postgis/postgis:18-3.6-alpine
    container_name: cloudkosh-pg-db
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=abcd123
    ports:
      - 5432:5432
    volumes:
      - ck-sockets:/var/run/postgresql
    networks:
      - ck_network    

  proxy:
    image: ghcr.io/social-mail/yarp-container:latest
    container_name: cloudkosh-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - FORWARD_PORT=/sockets/web-server.sock
      - FORWARD_SMTP_HOST=web-server
      - FORWARD_SMTP_PORT=/sockets/smtp-server.sock
      - AWS_ZONE_SUFFIX=.le.cloudkosh.com
      - SELF_IPs=127.0.0.1
      - ACME_MODE=self-signed
      - FORWARD_SMTP_DISABLE_SPF=yes
      - V1=1
    cap_add:
      - NET_ADMIN
    volumes:
      - ck-sockets:/sockets
      - ck-cache:/cache
    networks:
      - ck_network

  app:
    container_name: cloudkosh-server
    image: cloudkosh-test-server
    build:
      context: ../
      dockerfile: Dockerfile
    environment:
      - PORT=/sockets/web-server.sock
      - CLOUD_KOSH_DB_SSL=false
      - CLOUD_KOSH_PUBLIC_KEY=92349239434797
      - CLOUDKOSH_TEST_MODE=true
      - CLOUD_KOSH_DB_HOST=/var/run/postgresql
      - NODE_TEST=yes
      - PG_TEST=test
    volumes:
      - ck-sockets:/var/run/postgresql
      - ck-sockets:/sockets
      - ck-cache:/cache
    ports:
      - 9229:9229
      - 5432:5432
    networks:
      - ck_network
    dns:
      - 1.1.1.1
      - 8.8.8.8

volumes:
  ck-sockets:
    external: false
  ck-cache:
    external: false

networks:
  ck_network:
    driver: bridge
